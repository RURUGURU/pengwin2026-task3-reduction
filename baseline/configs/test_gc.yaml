# Task 3 v4.5 최종 제출 추론 계약
model_config: "model/AssemblyTransformer_coords"
checkpoint: /opt/ml/model/model.ckpt
input_dir: /tmp/t3in
npoints: 5000

# 최종 모델은 wide-augmentation simulation pretrain epoch 139이며 clinical LoRA를 쓰지 않는다.
training_mode: full
max_iters: 1
convergence_threshold: 2.0

# GT 없이 입력 mesh와 예측 pose만으로 적용하는 양방향 revert gate다.
# 중심 이동이 30 mm를 넘거나 회전이 25도를 넘으면 catastrophic move로 보고 identity로 되돌린다.
# 중심 이동 12 mm 미만이면서 회전 6도 미만이면 이미 조립에 가까운 조각으로 보고 identity를 유지한다.
pred_cat_d: 30.0
pred_cat_a: 25.0
pred_ao_d: 12.0
pred_ao_a: 6.0

debug_vis: false
output_type: "coords"
experiment_name: "assemble_coord_pretrain_wide"
