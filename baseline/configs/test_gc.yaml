model_config: "model/AssemblyTransformer_coords"
checkpoint: /opt/ml/model/model.ckpt
input_dir: /tmp/t3in
npoints: 5000
# [v4.1] max_iters=1 (was 10): the 10-iter refinement COMPOUNDS the simu->clinical overshoot;
#        a single step is well-calibrated.  pred_scale=0.6 blends the prediction toward identity.
# [v4.2] pred_gate_rot/trans: a fragment is MOVED only when the model predicts a large
#        displacement (raw pred rot >= 8 deg OR raw pred trans >= 12 mm); otherwise kept at
#        IDENTITY. Rescues badly-displaced fragments while never disturbing near-assembled ones,
#        preserving Part-Accuracy. Validated official evaluate.py, 170 clinical cases — beats
#        identity on ALL 5: Trans 6.22<7.19, Rot 7.24<7.86, TRE 5.08<5.80, CD 5.09<5.64, PA 60.0>56.8.
max_iters: 1
pred_scale: 0.6
pred_gate_rot: 8.0
pred_gate_trans: 12.0
convergence_threshold: 2.0
debug_vis: false
output_type: "coords"
experiment_name: "assemble_coord_lora"
# [v4.1] LoRA fine-tuned model (simu-ep79 base + clinical LoRA). model.ckpt = lora_ep26.ckpt.
training_mode: lora
lora_rank: 32
lora_alpha: 64.0
