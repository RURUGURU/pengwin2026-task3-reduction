<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">PENGWIN Task 3 AssemblyTransformer inference pipeline</title>
  <desc id="desc">OBJ fragments are sampled, encoded by AssemblyTransformer, gated, anchored to sacrum, and written as rigid transformation matrices.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <marker id="arr3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a5b4fc"/>
    </marker>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:34px;font-weight:700;fill:#f8fafc}
      .sub{font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:500;fill:#cbd5e1}
      .h{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}
      .t{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:500;fill:#e2e8f0}
      .tag{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;fill:#111827}
      .box{rx:18;stroke-width:2}
      .arrow{stroke:#a5b4fc;stroke-width:5;fill:none;marker-end:url(#arr3)}
    </style>
  </defs>
  <rect width="1600" height="560" rx="26" fill="url(#bg3)"/>
  <text x="70" y="68" class="title">Task 3 · Fragment reduction with AssemblyTransformer</text>
  <text x="70" y="103" class="sub">OBJ fragments become point clouds; the model predicts one rigid 4×4 transform per fragment.</text>

  <rect x="65" y="165" width="220" height="225" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="175" y="215" class="h" text-anchor="middle">OBJ fragments</text>
  <polygon points="125,300 165,245 210,280 190,340 135,345" fill="#f97316" opacity="0.9"/>
  <polygon points="205,250 245,275 235,330 195,310" fill="#22c55e" opacity="0.9"/>
  <text x="175" y="370" class="t" text-anchor="middle">SA / LI / RI groups</text>

  <path d="M285 278 L345 278" class="arrow"/>
  <rect x="355" y="165" width="235" height="225" class="box" fill="#0369a1" stroke="#7dd3fc"/>
  <text x="472" y="215" class="h" text-anchor="middle">Surface sampling</text>
  <text x="472" y="260" class="t" text-anchor="middle">5,000 points / fragment</text>
  <text x="472" y="296" class="t" text-anchor="middle">seed 0</text>
  <text x="472" y="332" class="t" text-anchor="middle">preserved fragment order</text>

  <path d="M590 278 L650 278" class="arrow"/>
  <rect x="660" y="145" width="300" height="265" class="box" fill="#6d28d9" stroke="#c4b5fd"/>
  <text x="810" y="202" class="h" text-anchor="middle">AssemblyTransformer</text>
  <text x="810" y="245" class="t" text-anchor="middle">embed 384 · 12 layers · 8 heads</text>
  <text x="810" y="281" class="t" text-anchor="middle">35,830,304 parameters</text>
  <text x="810" y="317" class="t" text-anchor="middle">wide-aug pretrain · epoch 139</text>
  <rect x="741" y="345" width="138" height="30" rx="15" fill="#ddd6fe"/>
  <text x="810" y="367" class="tag" text-anchor="middle">no clinical LoRA</text>

  <path d="M960 278 L1020 278" class="arrow"/>
  <rect x="1030" y="165" width="250" height="225" class="box" fill="#0f766e" stroke="#5eead4"/>
  <text x="1155" y="215" class="h" text-anchor="middle">Pose policy</text>
  <text x="1155" y="257" class="t" text-anchor="middle">rotation / translation gate</text>
  <text x="1155" y="293" class="t" text-anchor="middle">Sacrum anchor = identity</text>
  <text x="1155" y="329" class="t" text-anchor="middle">failure → valid identity JSON</text>

  <path d="M1280 278 L1340 278" class="arrow"/>
  <rect x="1350" y="165" width="185" height="225" class="box" fill="#be123c" stroke="#fda4af"/>
  <text x="1442" y="215" class="h" text-anchor="middle">Output</text>
  <text x="1442" y="260" class="t" text-anchor="middle">4×4 matrices</text>
  <text x="1442" y="296" class="t" text-anchor="middle">row-major JSON</text>
  <text x="1442" y="332" class="t" text-anchor="middle">all fragment IDs</text>

  <text x="70" y="466" class="sub">v4.5 Final · CD 4.281 · PA 0.6734 · Rotation 7.474° · Translation 5.556 mm · TRE 4.098 mm</text>
  <text x="70" y="506" class="sub">Metrics and provenance: README · release manifest · GET-only GC snapshot</text>
</svg>
